schema_version: 1

context:
  python_min: "3.9.6"
  name: nomad-camels-driver-keithley-2000
  version: "0.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/nomad_camels_driver_keithley_2000-${{ version }}.tar.gz
  sha256: 00e2120c3f4f8f57d45ca55006cb0b3b75687a274b232c6ddd8cc6fc81d063b0

build:
  number: 3
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python 3.9.6.*
    - setuptools >=61.0
    - pip
  run:
    - python >=${{ python_min }}
    - pyvisa
    - pyvisa-py

tests:
  - python:
      imports:
        - nomad_camels_driver_keithley_2000
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Device driver for the Keithley 2000 digitial multimeter.
  license: LGPL-2.1-or-later
  license_file: LICENSE.txt
  homepage: https://github.com/FAU-LAP/CAMELS_drivers

extra:
  recipe-maintainers:
    - jan-janssen
